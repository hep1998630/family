name: Weekly Backup

# Why this exists, two reasons in one workflow:
#
# 1. Backup. The family tree lives entirely in Supabase's Postgres
#    database. This workflow reads every row of every table through
#    Supabase's REST API (PostgREST) and uploads them as a downloadable
#    GitHub Actions artifact, so there's always a recent export sitting
#    somewhere outside the database itself.
#
# 2. Keep-alive. Supabase's free tier automatically PAUSES a project
#    after 7 days with no activity (see DEPLOYMENT.md's Troubleshooting
#    section). A real query against the database, even a read-only one,
#    counts as activity — so this same weekly run also prevents the
#    pause from ever happening, as long as it keeps running.
#
# Runs on a schedule, and can also be triggered manually any time from
# the Actions tab (useful right after setting this up, to check it
# actually works, without waiting a week).

on:
  schedule:
    # Fridays at 03:17 UTC. Deliberately NOT on the hour (:00) — GitHub
    # runs a huge number of workflows at every hour mark across all of
    # GitHub, which can delay a job queued right at :00 by several
    # minutes; a few minutes past the hour avoids that queue.
    - cron: '17 3 * * 5'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch every table from Supabase and back it up
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_ANON_KEY repository secrets are not set. See DEPLOYMENT.md for how to add them."
            exit 1
          fi

          mkdir -p backup

          # All five tables have public "select using (true)" RLS policies
          # (supabase/migrations/001, 003 and 005), so the anon key can read
          # them directly — no service-role key needed for a backup of
          # public data.
          #
          # The API returns at most 1000 rows per request and silently
          # stops there, so each table is read page by page (ordered by id,
          # so pages neither overlap nor skip) until a page comes back
          # short, then the pages are joined into one <table>.json.
          PAGE=1000
          for table in roots people partnerships parent_child saved_views; do
            echo "Fetching $table ..."
            offset=0
            pages=()
            while :; do
              page="backup/$table.offset-$offset.json"
              http_status=$(curl -sS -w "%{http_code}" -o "$page" \
                -H "apikey: $SUPABASE_ANON_KEY" \
                -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
                "$SUPABASE_URL/rest/v1/$table?select=*&order=id.asc&limit=$PAGE&offset=$offset")

              # saved_views only exists once migration 005 has been run —
              # back up everything else rather than fail the whole backup.
              if [ "$table" = "saved_views" ] && [ "$http_status" = "404" ]; then
                echo "::warning::saved_views not found (migration 005 not run?) — skipped"
                rm -f "$page"
                continue 2
              fi

              if [ "$http_status" != "200" ]; then
                echo "::error::Fetching $table failed with HTTP $http_status — see $page in the uploaded artifact for the raw response"
                cat "$page"
                exit 1
              fi

              # A misconfigured URL (e.g. one that already ends in /rest/v1,
              # see .env.example's warning) or an expired/paused project
              # often returns an HTML error page with a 200-looking status
              # from an intermediate proxy — catch that by requiring the
              # body to actually be a JSON array, not just checking the
              # status code above.
              if ! jq -e 'type == "array"' "$page" >/dev/null 2>&1; then
                echo "::error::Response for $table was not a JSON list — see $page in the uploaded artifact for the raw response"
                cat "$page"
                exit 1
              fi

              pages+=("$page")
              rows=$(jq 'length' "$page")
              if [ "$rows" -lt "$PAGE" ]; then break; fi
              offset=$((offset + PAGE))
            done

            jq -s 'add' "${pages[@]}" > "backup/$table.json"
            rm "${pages[@]}"
            echo "$table: $(jq 'length' "backup/$table.json") rows"
          done

      # Also when the step above failed, so the raw failed response it
      # points to is actually there to look at.
      - name: Upload backup artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: family-tree-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
